default:
  image: docker:stable
  services: 
    - name: docker:dind  
      command: ["--tls=false"]
  before_script:
  - apk add --no-cache docker-compose curl apache2-utils
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build-job:
  stage: build
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - docker-compose build

test-job1:
  stage: test
  script:
    - echo "Testing request to servers"
    - htpasswd -c -b .htpasswd ${USERNAME} ${PASSWORD}
    - docker-compose up --build -d
    
    # Basic auth request - fail if status code isn't 200
    - curl -f -u "$USERNAME:$PASSWORD" http://docker:8198/request
    
    - echo "Testing state callouts"
    # Check for correct output
    - curl -s -S -X PUT http://docker:8197/state -d "PAUSED" 
    - curl -s -S -X PUT http://docker:8197/state -d "RUNNING" 
    - curl -s -S -X GET http://docker:8197/state
    - curl -s -S -X GET http://docker:8197/state | ( grep -q "PAUSED")
    - curl -s -S -X GET http://docker:8197/state | ( grep -q "RUNNING")
    - curl -s -S -X GET http://docker:8197/state | ( grep -q "INIT")
    - curl -s -S -X PUT http://docker:8197/state -d "RUNNING" 
    - curl -s -S -X GET http://docker:8197/state 
    - curl -s -S -X GET http://docker:8197/state 
    - curl -s -S -X GET http://docker:8197/state | ( grep -q "RUNNING")
    - curl -s -S -X GET http://docker:8197/state | ( grep -q "RUNNING")
    - curl -s -S -X GET http://docker:8197/state 

    - echo "Testing callouts to paused server"
    - curl -s -S -X PUT http://docker:8197/state -d "PAUSED" 
    - curl -s -S -X PUT http://docker:8197/state -d "PAUSED" 
    - curl -s -S -X GET http://docker:8197/state
    - curl -s -S -f -u "$USERNAME:$PASSWORD" http://docker:8198/request | ( grep -q "")
    - curl -s -S -f -u "$USERNAME:$PASSWORD" http://docker:8198 | ( grep -q "")

    - docker-compose down

deploy-prod:
  stage: deploy
  script:
    - echo "Deploy the application to production"
    - docker-compose down --remove-orphans
    - docker-compose pull
    - docker-compose up -d
  only:
    - project
  environment: production

