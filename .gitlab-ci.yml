default:
  image: docker:stable
  services: 
    - name: docker:dind  
      command: ["--tls=false"]
  before_script:
  - apk add --no-cache docker-compose curl apache2-utils
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build-job:
  stage: build
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - docker-compose build

test-job1:
  stage: test
  script:
    - echo "Testing request to servers"
    - htpasswd -c -b .htpasswd ${USERNAME} ${PASSWORD}
    - docker-compose up --build -d
    
    # Basic auth request - fail if status code isn't 200
    - curl -f -u "$USERNAME:$PASSWORD" http://docker:8198/request
    
    - echo "Testing state callouts"
    # Check for errors in responses
    - curl -s -S -X PUT http://docker:8197/state -d "PAUSED" | (! grep -q "Error")
    - curl -s -S -X PUT http://docker:8197/state -d "RUNNING" | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X PUT http://docker:8197/state -d "RUNNING" | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X PUT http://docker:8197/state -d "INIT" | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")
    - curl -s -S -X PUT http://docker:8197/state -d "SHUTDOWN" | (! grep -q "Error")
    - curl -s -S -X GET http://docker:8197/state | (! grep -q "Error")

    # This should fail if there's no error (testing error condition)
    - curl -s -X PUT http://docker:8197/state | grep "Error"

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production

